name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test functions/test/*.test.js
      - run: node --check functions/index.js
  build:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [modern, legacy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: matrix.profile == 'modern'
        with:
          channel: stable
          cache: true
      - uses: subosito/flutter-action@v2
        if: matrix.profile == 'legacy'
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Prepare Android project
        run: python3 scripts/prepare_android.py --profile ${{ matrix.profile }}
      - name: Configure Firebase and signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_TITLE: ${{ vars.APP_TITLE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/configure_build.py
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK for each architecture
        run: flutter build apk --release --split-per-abi --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.profile }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            pubspec.lock
          if-no-files-found: error
          retention-days: 14
