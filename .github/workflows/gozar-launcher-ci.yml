name: Validate Rosha Native Launcher

on:
  workflow_dispatch:
  push:
    branches: [three-independent-apps]
    paths:
      - 'lib/gozar_launcher.dart'
      - 'lib/gozar_main.dart'
      - 'lib/rosha_quotes.dart'
      - 'lib/gozar_platform_bridge.dart'
      - 'lib/gozar_notes_store.dart'
      - 'lib/gozar_notes_screen.dart'
      - 'lib/gozar_shortcuts.dart'
      - 'native/GozarPlatformBridge.kt'
      - 'native/GozarWebActivity.kt'
      - 'native/GozarReminderBridge.kt'
      - 'test/gozar_launcher_test.dart'
      - 'test/gozar_notes_test.dart'
      - 'test/gozar_shortcuts_test.dart'
      - 'test/td_gozar_app_test.dart'
      - 'test/rosha_quotes_test.dart'
      - 'scripts/configure_gozar_standalone.py'
      - 'scripts/configure_variant.py'
      - 'scripts/verify_apk_variant.py'
      - '.github/workflows/gozar-launcher-ci.yml'

permissions:
  contents: read

concurrency:
  group: rosha-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rosha:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare standalone Rosha Android host
        run: |
          python3 scripts/prepare_android.py --profile modern
          python3 scripts/configure_variant.py gozar
          python3 scripts/configure_gozar_standalone.py
      - name: Install licensed Vazirmatn assets
        run: |
          mkdir -p assets/fonts
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf -o assets/fonts/Vazirmatn-Regular.ttf
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf -o assets/fonts/Vazirmatn-Bold.ttf
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt -o assets/fonts/OFL.txt
          test -s assets/fonts/Vazirmatn-Regular.ttf
          test -s assets/fonts/Vazirmatn-Bold.ttf
      - name: Verify Flutter launcher code
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib/gozar_launcher.dart lib/gozar_main.dart lib/rosha_quotes.dart lib/gozar_platform_bridge.dart lib/gozar_shortcuts.dart lib/gozar_notes_store.dart lib/gozar_notes_screen.dart test/gozar_launcher_test.dart test/gozar_notes_test.dart test/td_gozar_app_test.dart test/gozar_shortcuts_test.dart test/rosha_quotes_test.dart
      - name: Test launcher persistence and interaction
        run: flutter test --reporter expanded test/gozar_launcher_test.dart
      - name: Test Persian notes and in-app calendar
        run: flutter test --reporter expanded test/gozar_notes_test.dart
      - name: Test Rosha navigation, quotes and shortcuts
        run: |
          flutter test --reporter expanded test/td_gozar_app_test.dart
          flutter test --reporter expanded test/gozar_shortcuts_test.dart
          flutter test --reporter expanded test/rosha_quotes_test.dart
      - name: Verify Android host has no VPN components
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          launcher = next((root / 'kotlin').rglob('GozarPlatformBridge.kt')).read_text()
          for action in ('openShortcutApp', 'openShortcutWeb', 'appIcon', 'installedApps'):
              assert launcher.count(f'"{action}" ->') == 1, action
          assert 'getInstalledApplications' in launcher
          assert 'queryIntentActivities' in launcher
          assert 'CATEGORY_LAUNCHER' in launcher
          assert 'MATCH_ALL' in launcher
          assert 'rosha-installed-apps' in launcher

          main = next((root / 'kotlin').rglob('MainActivity.kt')).read_text()
          manifest = (root / 'AndroidManifest.xml').read_text()
          alarm = next((root / 'kotlin').rglob('GozarReminderBridge.kt')).read_text()

          assert 'GozarPlatformBridge.attach(this, flutterEngine)' in main
          for forbidden in ('GozarVpnBridge', 'SystemVpnBridge', 'WireGuard'):
              assert forbidden not in main, forbidden
          assert not list((root / 'kotlin').rglob('GozarVpnService.kt'))
          assert not list((root / 'kotlin').rglob('SystemVpnService.kt'))
          assert not list((root / 'kotlin').rglob('WireGuardController.kt'))

          for forbidden in (
              'BIND_VPN_SERVICE',
              'android.net.VpnService',
              'GozarVpnService',
              'FOREGROUND_SERVICE_SPECIAL_USE',
          ):
              assert forbidden not in manifest, forbidden
          assert 'android.permission.QUERY_ALL_PACKAGES' in manifest
          assert '.GozarWebActivity' in manifest
          assert 'android.intent.category.LAUNCHER' in manifest

          main_dart = Path('lib/gozar_main.dart').read_text()
          assert main_dart.count('NavigationDestination(') == 3
          for forbidden in (
              'VPN', 'Xray', 'WireGuard', 'GozarVpnBridge',
              'gozar_vpn.dart', 'gozar_subscription.dart',
          ):
              assert forbidden not in main_dart, forbidden
          assert "label: 'خانه'" in main_dart
          assert "label: 'یادداشت'" in main_dart
          assert "label: 'تنظیمات'" in main_dart
          assert "ValueKey('gozar-home-motivation')" in main_dart

          icon = (root / 'res/mipmap-anydpi/ic_launcher.xml').read_text()
          assert '#163B65' in icon
          assert '#61E9DA' in icon
          assert '#F3B63E' in icon

          for name in (
              'GozarReminderReceiver',
              'GozarReminderBootReceiver',
              'SCHEDULE_EXACT_ALARM',
              'RECEIVE_BOOT_COMPLETED',
          ):
              assert name in manifest, name
          for action in (
              'setExactAndAllowWhileIdle',
              'setAndAllowWhileIdle',
              'POST_NOTIFICATIONS',
              'ACTION_BOOT_COMPLETED',
          ):
              assert action in alarm, action
          print('Rosha launcher + notes verified; VPN is fully absent.')
          PY
      - name: Compile Rosha ARM64
        run: |
          python3 scripts/configure_build.py
          flutter build apk --release --target lib/gozar_main.dart --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=APP_VARIANT=gozar
          python3 scripts/verify_apk_variant.py gozar
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Publish verified Rosha APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Rosha-A54
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
