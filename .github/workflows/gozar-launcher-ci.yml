name: Validate Gozar Native Launcher

on:
  workflow_dispatch:
  push:
    branches: [three-independent-apps, feature/forkgram-embedded-telegram]
    paths:
      - 'lib/gozar_launcher.dart'
      - 'lib/gozar_main.dart'
      - 'lib/gozar_social.dart'
      - 'native/GozarSocialWebView.kt'
      - 'native/GozarSocialDownloads.kt'
      - 'scripts/configure_variant.py'
      - 'test/gozar_social_test.dart'
      - 'lib/gozar_notes_store.dart'
      - 'lib/gozar_notes_screen.dart'
      - 'test/gozar_notes_test.dart'
      - 'native/GozarReminderBridge.kt'
      - 'lib/gozar_shortcuts.dart'
      - 'test/gozar_launcher_test.dart'
      - 'test/td_gozar_app_test.dart'
      - 'scripts/configure_gozar_standalone.py'
      - '.github/workflows/gozar-launcher-ci.yml'

permissions:
  contents: read

concurrency:
  group: gozar-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gozar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare independent Android VPN host
        run: |
          python3 scripts/prepare_android.py --profile modern
          python3 scripts/configure_variant.py gozar
          python3 scripts/enable_full_vpn.py
          python3 scripts/configure_gozar_standalone.py
      - name: Install pinned Xray engine
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar \
            -o android/app/libs/libv2ray.aar
          echo '9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de  android/app/libs/libv2ray.aar' | sha256sum -c -
      - name: Install licensed Vazirmatn assets
        run: |
          mkdir -p assets/fonts
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf -o assets/fonts/Vazirmatn-Regular.ttf
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf -o assets/fonts/Vazirmatn-Bold.ttf
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt -o assets/fonts/OFL.txt
          test -s assets/fonts/Vazirmatn-Regular.ttf
          test -s assets/fonts/Vazirmatn-Bold.ttf
      - name: Verify Flutter launcher code
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib/gozar_launcher.dart lib/gozar_main.dart lib/gozar_shortcuts.dart lib/gozar_notes_store.dart lib/gozar_notes_screen.dart test/gozar_launcher_test.dart test/gozar_notes_test.dart
      - name: Test launcher persistence and interaction
        run: flutter test --reporter expanded test/gozar_launcher_test.dart
      - name: Test Persian notes and in-app calendar
        run: flutter test --reporter expanded test/gozar_notes_test.dart
      - name: Test Gozar navigation and VPN regressions
        run: |
          flutter test --reporter expanded test/td_gozar_app_test.dart
          flutter test --reporter expanded test/gozar_shortcuts_test.dart
      - name: Verify standalone Android app launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          bridge = next((root / 'kotlin').rglob('SystemVpnBridge.kt')).read_text()
          for action in ('openShortcutApp', 'appIcon', 'installedApps'):
              assert bridge.count(f'"{action}" ->') == 1, action
          assert 'InternalTelegramProxyService' not in bridge
          main = next((root / 'kotlin').rglob('MainActivity.kt')).read_text()
          manifest = (root / 'AndroidManifest.xml').read_text()
          alarm = next((root / 'kotlin').rglob('GozarReminderBridge.kt')).read_text()
          assert 'GozarReminderBridge.attach(this, flutterEngine)' in main
          assert 'GozarSocialWebViewFactory' not in main
          assert not list((root / 'kotlin').rglob('GozarSocialWebView.kt'))
          assert not list((root / 'kotlin').rglob('GozarSocialDownloads.kt'))
          main_dart = Path('lib/gozar_main.dart').read_text()
          assert "label: 'شبکه'" not in main_dart
          assert 'GozarSocialTab' not in main_dart
          icon = (root / 'res/mipmap-anydpi/ic_launcher.xml').read_text()
          assert '#0C5489' in icon and '#61E9DA' in icon
          for name in ('GozarReminderReceiver', 'GozarReminderBootReceiver',
                       'SCHEDULE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED'):
              assert name in manifest, name
          for action in ('setExactAndAllowWhileIdle', 'setAndAllowWhileIdle',
                         'POST_NOTIFICATIONS', 'ACTION_BOOT_COMPLETED'):
              assert action in alarm, action
          print('Launcher and native reminder alarm handlers are present.')
          PY
      - name: Compile Gozar ARM64 without full artifact quota
        run: |
          python3 scripts/configure_build.py
          flutter build apk --release --target lib/gozar_main.dart --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=APP_VARIANT=gozar
          python3 scripts/verify_apk_variant.py gozar
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          echo 'Gozar APK compiled and verified; attempting to publish the installable file.'
      - name: Publish verified Gozar launcher APK
        # Quota exhaustion must not misreport compilation/test success as failure.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Gozar-Launcher-A54
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
