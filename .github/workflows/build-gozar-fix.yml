name: Build Gozar cancellation fix A54
'on':
  push:
    branches:
    - fix/gozar-cancel-and-fit
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: gozar-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gozar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        cache: true
        channel: stable
    - name: Prepare A54 Android host
      run: python3 scripts/prepare_android.py --profile modern
    - name: Configure independent app ID, label and launcher icon
      run: python3 scripts/configure_variant.py gozar
    - name: Add Android VPN service only to Gozar
      run: python3 scripts/enable_full_vpn.py
    - name: Remove all Telegram components from standalone Gozar
      run: python3 scripts/configure_gozar_standalone.py
    - name: Install verified Xray TUN engine for arm64 Android
      run: |
        mkdir -p android/app/libs
        curl -fL --retry 3 --retry-delay 3 \
          https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar \
          -o android/app/libs/libv2ray.aar
        echo '9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de  android/app/libs/libv2ray.aar' | sha256sum -c -
    - name: Install the provided open-licensed Vazirmatn typeface for Gozar only
      run: |
        mkdir -p assets/fonts
        curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf -o assets/fonts/Vazirmatn-Regular.ttf
        curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf -o assets/fonts/Vazirmatn-Bold.ttf
        curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt -o assets/fonts/OFL.txt
        test -s assets/fonts/Vazirmatn-Regular.ttf && test -s assets/fonts/Vazirmatn-Bold.ttf
    - name: Restore dependencies
      run: flutter pub get
    - name: Validate Gozar standalone VPN source
      run: flutter analyze --no-fatal-infos lib/gozar_main.dart lib/td_system_vpn.dart lib/td_vmess_parser.dart lib/gozar_visuals.dart
    - name: Verify VMess VPN profiles and preserve other protocols
      run: flutter test test/td_system_vpn_test.dart
    - name: Verify standalone Gozar has no Telegram features
      run: flutter test test/td_gozar_app_test.dart
    - name: Verify Android VPN per-app selection bridge
      run: flutter test test/td_vpn_routing_test.dart
    - env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      name: Configure optional release signing
      run: python3 scripts/configure_build.py
    - name: Compile separately installable A54 application
      run: flutter build apk --release --target lib/gozar_main.dart --target-platform android-arm64 --build-number=$((1000 + ${{ github.run_number }})) --dart-define=APP_VARIANT=gozar
    - name: Give artifact a distinct name
      run: python3 scripts/verify_apk_variant.py gozar
    - name: Name the installable APK
      run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Gozar-A54.apk
    - uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: Gozar-A54
        path: build/app/outputs/flutter-apk/Gozar-A54.apk
        retention-days: 14
