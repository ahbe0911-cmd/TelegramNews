name: Test Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/check-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/src/index.mjs
      - run: node --test worker/test/*.test.mjs
