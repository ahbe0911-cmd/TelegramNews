name: Build TDLib A54 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/td_news_*.dart'
      - 'pubspec.yaml'
      - '.github/workflows/build-tdlib-a54.yml'
permissions:
  contents: read
concurrency:
  group: tdlib-a54-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare A54 Android host
        run: python3 scripts/prepare_android.py --profile modern
      - name: Restore dependencies
        run: flutter pub get
      - name: Adapt older TDLib plugin for Android Gradle namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plugins = list(Path.home().glob('.pub-cache/hosted/pub.dev/tdlib-1.6.0/android/build.gradle'))
          if len(plugins) != 1:
              raise SystemExit('Expected TDLib plugin version 1.6.0 is missing')
          gradle = plugins[0]
          source = gradle.read_text()
          if "namespace 'org.naji.td.tdlib'" not in source:
              source = source.replace('android {', "android {\n    namespace 'org.naji.td.tdlib'", 1)
              gradle.write_text(source)
          PY
      - name: Validate TDLib application source
        run: dart analyze lib/td_news_engine.dart lib/td_news_main.dart
      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/configure_build.py
      - name: Compile new TDLib A54 application
        run: flutter build apk --release --target lib/td_news_main.dart --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: Give artifact a distinct name
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NabzKhabar-TDLib-A54.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NabzKhabar-TDLib-A54
          path: build/app/outputs/flutter-apk/NabzKhabar-TDLib-A54.apk
          if-no-files-found: error
          retention-days: 14
