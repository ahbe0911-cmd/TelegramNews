name: Build TDLib A54 APK
on:
  workflow_dispatch:
  push:
    branches: [main, vpn-development]
    paths:
      - 'lib/td_news_*.dart'
      - 'lib/td_telegram_saved_page.dart'
      - 'lib/td_system_vpn.dart'
      - 'native/SystemVpnBridge.kt'
      - 'native/SystemVpnService.kt'
      - 'scripts/enable_full_vpn.py'
      - 'lib/td_media_viewer.dart'
      - 'lib/td_inline_video.dart'
      - 'lib/td_clock_card.dart'
      - 'lib/td_downloads.dart'
      - 'pubspec.yaml'
      - 'scripts/prepare_android.py'
      - 'scripts/configure_variant.py'
      - 'scripts/build_tdlib_a54.sh'
      - 'scripts/verify_apk_variant.py'
      - 'test/td_news_engine_test.dart'
      - 'test/td_system_vpn_test.dart'
      - 'test/td_news_ui_test.dart'
      - 'test/td_inline_video_test.dart'
      - 'test/td_downloads_test.dart'
      - '.github/workflows/build-tdlib-a54.yml'
permissions:
  contents: read
concurrency:
  group: tdlib-a54-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: native-tdlib
          key: tdlib-arm64-d1085f9cebc5a62379991ae1652673954f229c1f-ndk27-openssl332-v1
      - name: Build current official Telegram media engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_tdlib_a54.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TDLib-ARM64-engine
          path: native-tdlib/
          if-no-files-found: error
          retention-days: 14
  android:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: news
            artifact: NabzKhabar-News-A54
          - variant: cafenet
            artifact: Cafenet-A54
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare A54 Android host
        run: python3 scripts/prepare_android.py --profile modern
      - name: Configure independent app ID, label and launcher icon
        run: python3 scripts/configure_variant.py ${{ matrix.variant }}
      - name: Add Android platform VPN service and native bridge
        run: python3 scripts/enable_full_vpn.py
      - name: Install verified Xray TUN engine for arm64 Android
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar \
            -o android/app/libs/libv2ray.aar
          echo '9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de  android/app/libs/libv2ray.aar' | sha256sum -c -
      - name: Restore dependencies
        run: flutter pub get
      - name: Adapt older TDLib plugin for Android Gradle namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plugins = list(Path.home().glob('.pub-cache/hosted/pub.dev/tdlib-1.6.0/android/build.gradle'))
          if len(plugins) != 1:
              raise SystemExit('Expected TDLib plugin version 1.6.0 is missing')
          gradle = plugins[0]
          source = gradle.read_text()
          if "namespace 'org.naji.td.tdlib'" not in source:
              source = source.replace('android {', "android {\n    namespace 'org.naji.td.tdlib'", 1)
          if 'compileSdkVersion 31' not in source:
              raise SystemExit('Unexpected TDLib compileSdk: check plugin Gradle setup')
          source = source.replace('compileSdkVersion 31', 'compileSdkVersion 36', 1)
          gradle.write_text(source)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: TDLib-ARM64-engine
          path: native-tdlib
      - name: Replace outdated native library with the verified ARM64 build
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          native = Path('native-tdlib/libtdjson.so')
          assert native.stat().st_size > 1000000
          assert Path('native-tdlib/revision.txt').read_text().strip() == 'd1085f9cebc5a62379991ae1652673954f229c1f'
          targets = list(Path.home().glob('.pub-cache/hosted/pub.dev/tdlib-1.6.0/android/**/arm64-v8a/libtdjson.so'))
          assert len(targets) == 1, targets
          shutil.copyfile(native, targets[0])
          PYTHON
      - name: Validate TDLib application source
        run: flutter analyze --no-fatal-infos lib
      - name: Test channel parsing and local sources
        run: flutter test test/td_news_engine_test.dart
      - name: Verify VMess VPN profiles and preserve other protocols
        run: flutter test test/td_system_vpn_test.dart
      - name: Verify home and settings layout
        run: flutter test test/td_news_ui_test.dart
      - name: Verify lazy inline video and justified Persian text
        run: flutter test test/td_inline_video_test.dart
      - name: Verify full-resolution photo and document downloads
        run: flutter test test/td_downloads_test.dart
      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/configure_build.py
      - name: Compile new TDLib A54 application
        run: flutter build apk --release --target lib/td_news_main.dart --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=APP_VARIANT=${{ matrix.variant }}
      - name: Give artifact a distinct name
        run: python3 scripts/verify_apk_variant.py ${{ matrix.variant }}
      - name: Name the installable APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk
          if-no-files-found: error
          retention-days: 14
