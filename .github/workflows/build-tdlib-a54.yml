name: Build Independent News Cafenet Gozar A54 APKs
on:
  workflow_dispatch:
  push:
    branches: [main, vpn-development, three-independent-apps]
    paths:
      - 'lib/td_news_*.dart'
      - 'lib/td_telegram_saved_page.dart'
      - 'lib/td_system_vpn.dart'
      - 'lib/gozar_main.dart'
      - 'lib/gozar_social.dart'
      - 'lib/gozar_subscription.dart'
      - 'lib/gozar_visuals.dart'
      - 'lib/gozar_shortcuts.dart'
      - 'lib/gozar_launcher.dart'
      - 'lib/gozar_notes_store.dart'
      - 'lib/gozar_notes_screen.dart'
      - 'lib/gozar_dashboard_clock.dart'
      - 'lib/td_vmess_parser.dart'
      - 'native/SystemVpnBridge.kt'
      - 'native/GozarWebActivity.kt'
      - 'native/GozarSocialWebView.kt'
      - 'native/GozarReminderBridge.kt'
      - 'native/SystemVpnService.kt'
      - 'native/AutomaticBypassPolicy.kt'
      - 'native/InternalTelegramProxyService.kt'
      - 'scripts/enable_full_vpn.py'
      - 'scripts/configure_gozar_standalone.py'
      - 'lib/td_media_viewer.dart'
      - 'lib/td_inline_video.dart'
      - 'lib/td_clock_card.dart'
      - 'lib/td_downloads.dart'
      - 'pubspec.yaml'
      - 'scripts/prepare_android.py'
      - 'scripts/configure_variant.py'
      - 'scripts/build_tdlib_a54.sh'
      - 'scripts/verify_apk_variant.py'
      - 'test/td_news_engine_test.dart'
      - 'test/td_system_vpn_test.dart'
      - 'test/td_internal_vpn_test.dart'
      - 'test/td_gozar_app_test.dart'
      - 'test/gozar_shortcuts_test.dart'
      - 'test/gozar_notes_test.dart'
      - 'test/gozar_launcher_test.dart'
      - 'test/gozar_social_test.dart'
      - 'test/gozar_subscription_test.dart'
      - 'test/td_vpn_routing_test.dart'
      - 'native/VpnRoutingPolicy.kt'
      - 'test/td_news_ui_test.dart'
      - 'test/td_inline_video_test.dart'
      - 'test/td_downloads_test.dart'
      - '.github/workflows/build-tdlib-a54.yml'
permissions:
  contents: read
concurrency:
  group: tdlib-a54-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: native-tdlib
          key: tdlib-arm64-d1085f9cebc5a62379991ae1652673954f229c1f-ndk27-openssl332-v1
      - name: Build current official Telegram media engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_tdlib_a54.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TDLib-ARM64-engine
          path: native-tdlib/
          if-no-files-found: error
          retention-days: 14
  android:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: news
            artifact: NabzKhabar-News-A54
          - variant: cafenet
            artifact: Cafenet-A54
          - variant: gozar
            artifact: Gozar-A54
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare A54 Android host
        run: python3 scripts/prepare_android.py --profile modern
      - name: Configure independent app ID, label and launcher icon
        run: python3 scripts/configure_variant.py ${{ matrix.variant }}
      - name: Add Android VPN service only to Gozar
        if: matrix.variant == 'gozar'
        run: python3 scripts/enable_full_vpn.py
      - name: Remove all Telegram components from standalone Gozar
        if: matrix.variant == 'gozar'
        run: python3 scripts/configure_gozar_standalone.py
      - name: Verify shortcut launch and icon handlers in generated Android host
        if: matrix.variant == 'gozar'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          folder = Path('android/app/src/main')
          bridge = next((folder / 'kotlin').rglob('SystemVpnBridge.kt')).read_text()
          for method in ('openShortcutApp', 'openShortcutWeb', 'appIcon', 'installedApps'):
              assert bridge.count(f'"{method}" ->') == 1, method
          assert 'InternalTelegramProxyService' not in bridge
          assert '"component" to info.activityInfo.name' in bridge
          manifest = (folder / 'AndroidManifest.xml').read_text()
          assert '.GozarWebActivity' in manifest
          assert 'android.intent.category.LAUNCHER' in manifest
          print('Verified launch, icon, picker and in-app web handlers in the actual Gozar host')
          PY
      - name: Install verified Xray TUN engine for arm64 Android
        if: matrix.variant == 'gozar'
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar \
            -o android/app/libs/libv2ray.aar
          echo '9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de  android/app/libs/libv2ray.aar' | sha256sum -c -
      - name: Install the provided open-licensed Vazirmatn typeface for Gozar only
        if: matrix.variant == 'gozar'
        run: |
          mkdir -p assets/fonts
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf -o assets/fonts/Vazirmatn-Regular.ttf
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf -o assets/fonts/Vazirmatn-Bold.ttf
          curl -fLsS --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt -o assets/fonts/OFL.txt
          test -s assets/fonts/Vazirmatn-Regular.ttf && test -s assets/fonts/Vazirmatn-Bold.ttf
      - name: Restore dependencies
        run: flutter pub get
      - name: Adapt older TDLib plugin for Android Gradle namespace
        if: matrix.variant != 'gozar'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plugins = list(Path.home().glob('.pub-cache/hosted/pub.dev/tdlib-1.6.0/android/build.gradle'))
          if len(plugins) != 1:
              raise SystemExit('Expected TDLib plugin version 1.6.0 is missing')
          gradle = plugins[0]
          source = gradle.read_text()
          if "namespace 'org.naji.td.tdlib'" not in source:
              source = source.replace('android {', "android {\n    namespace 'org.naji.td.tdlib'", 1)
          if 'compileSdkVersion 31' not in source:
              raise SystemExit('Unexpected TDLib compileSdk: check plugin Gradle setup')
          source = source.replace('compileSdkVersion 31', 'compileSdkVersion 36', 1)
          gradle.write_text(source)
          PY
      - uses: actions/download-artifact@v4
        if: matrix.variant != 'gozar'
        with:
          name: TDLib-ARM64-engine
          path: native-tdlib
      - name: Replace outdated native library with the verified ARM64 build
        if: matrix.variant != 'gozar'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          native = Path('native-tdlib/libtdjson.so')
          assert native.stat().st_size > 1000000
          assert Path('native-tdlib/revision.txt').read_text().strip() == 'd1085f9cebc5a62379991ae1652673954f229c1f'
          targets = list(Path.home().glob('.pub-cache/hosted/pub.dev/tdlib-1.6.0/android/**/arm64-v8a/libtdjson.so'))
          assert len(targets) == 1, targets
          shutil.copyfile(native, targets[0])
          PYTHON
      - name: Validate independent Telegram app sources
        if: matrix.variant != 'gozar'
        run: flutter analyze --no-fatal-infos lib
      - name: Validate Gozar standalone VPN source
        if: matrix.variant == 'gozar'
        run: flutter analyze --no-fatal-infos lib/gozar_main.dart lib/gozar_visuals.dart lib/gozar_shortcuts.dart lib/gozar_launcher.dart lib/gozar_notes_store.dart lib/gozar_notes_screen.dart lib/gozar_dashboard_clock.dart lib/gozar_subscription.dart lib/td_system_vpn.dart lib/td_vmess_parser.dart test/td_gozar_app_test.dart test/gozar_shortcuts_test.dart test/gozar_notes_test.dart
      - name: Test channel parsing and local sources
        if: matrix.variant != 'gozar'
        run: flutter test test/td_news_engine_test.dart
      - name: Verify VMess VPN profiles and preserve other protocols
        if: matrix.variant == 'gozar'
        run: flutter test test/td_system_vpn_test.dart
      - name: Verify Gozar subscription import and server selection
        if: matrix.variant == 'gozar'
        run: flutter test test/gozar_subscription_test.dart
      - name: Verify saved user shortcuts and HTTPS validation
        if: matrix.variant == 'gozar'
        run: flutter test --reporter expanded test/gozar_shortcuts_test.dart
      - name: Verify Android shortcut launcher fallback is packaged
        if: matrix.variant == 'gozar'
        run: |
          grep -q 'CATEGORY_LAUNCHER' native/SystemVpnBridge.kt
          grep -q 'FLAG_ACTIVITY_RESET_TASK_IF_NEEDED' native/SystemVpnBridge.kt
          grep -q 'getLaunchIntentForPackage' native/SystemVpnBridge.kt
          grep -q 'component' lib/gozar_shortcuts.dart
      - name: Verify Persian notes and scheduled reminder model
        if: matrix.variant == 'gozar'
        run: flutter test --reporter expanded test/gozar_notes_test.dart
      - name: Verify saved launcher sections and Android app launch
        if: matrix.variant == 'gozar'
        run: flutter test --reporter expanded test/gozar_launcher_test.dart
      - name: Verify standalone Gozar has no Telegram features
        if: matrix.variant == 'gozar'
        run: flutter test --reporter expanded test/td_gozar_app_test.dart
      - name: Verify Android VPN per-app selection bridge
        if: matrix.variant == 'gozar'
        run: flutter test test/td_vpn_routing_test.dart
      - name: Verify home and settings layout
        if: matrix.variant != 'gozar'
        run: flutter test test/td_news_ui_test.dart
      - name: Verify lazy inline video and justified Persian text
        if: matrix.variant != 'gozar'
        run: flutter test test/td_inline_video_test.dart
      - name: Verify full-resolution photo and document downloads
        if: matrix.variant != 'gozar'
        run: flutter test test/td_downloads_test.dart
      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/configure_build.py
      - name: Compile separately installable A54 application
        run: |
          if [ "${{ matrix.variant }}" = "gozar" ]; then
            TARGET=lib/gozar_main.dart
          else
            TARGET=lib/td_news_main.dart
          fi
          flutter build apk --release --target "$TARGET" --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=APP_VARIANT=${{ matrix.variant }}
      - name: Give artifact a distinct name
        run: python3 scripts/verify_apk_variant.py ${{ matrix.variant }}
      - name: Name the installable APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk
          if-no-files-found: error
          retention-days: 14
